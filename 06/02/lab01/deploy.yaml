apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: lab01
spec:
  replicas: 4
  
  selector: 
    matchLabels:
      app: nginx

  template: 
    metadata:  
      namespace:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx
        image: nginx:name
        ports:
        - containerPort: 80